<ng-container [ngSwitch]="frame.apps_frame_type">
  <div [attr.name]="'canvasClick#'+frame.apps_page_frame_seqid">
    <ng-container *ngSwitchCase="'CANVAS'">

      <ng-container *ngIf="(frame.apps_page_frame_seqid != (object_mast.Level2[page_no].object_code + '-PARA')) ">

        <app-frame-canvas [frame]="frame" [wsdp]="wsdp" [sessionObj]="sessionObj" [wscp_send_input]="wscp"
          [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)">
        </app-frame-canvas>
      </ng-container>
    </ng-container>

    <ng-container *ngSwitchCase="'TABLE'">
      <!-- <app-frame-table [frame]="frame" [wsdp]="wsdp" [wsdpcl]="wsdpcl" [sessionObj]="sessionObj"
                [wscp_send_input]="wscp" (emitPass)="itemClicked($event)">
              </app-frame-table> -->
      <app-frame-new-table [frame]="frame" [wsdp]="wsdp" [wsdpcl]="wsdpcl" [sessionObj]="sessionObj"
        [object_mast]="object_mast" [page_no]="page_no" [wscp_send_input]="wscp" (emitPass)="itemClicked($event)"
        (personalize)="personalizeclick($event)">
      </app-frame-new-table>
    </ng-container>

    <ng-container *ngSwitchCase="'ENTRY_TABLE'">
      <!-- <app-frame-table2 [frame]="frame" [wsdp]="wsdp" [sessionObj]="sessionObj" [wscp_send_input]="wscp"
      [sessionObj]="sessionObj" [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)">
    </app-frame-table2> -->
      <!-- <app-frame-newtable2 [frame]="frame" [wsdp]="wsdp" [wscp_send_input]="wscp" [object_mast]="object_mast"
        [page_no]="page_no" [sessionObj]="sessionObj" [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)"
        (personalize)="personalizeclick($event)">
      </app-frame-newtable2> -->

      <ng-container *ngIf="frame.apps_frame_sub_type != 'NEW'; else newEntryTable">

        <app-frame-newtable2 [frame]="frame" [wsdp]="wsdp" [wscp_send_input]="wscp" [object_mast]="object_mast"
        [page_no]="page_no" [sessionObj]="sessionObj" [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)"
        (personalize)="personalizeclick($event)">
      </app-frame-newtable2>
        <!-- <app-frame-table2 [frame]="frame" [wsdp]="wsdp" [sessionObj]="sessionObj" [wscp_send_input]="wscp"
          [sessionObj]="sessionObj" [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)">
        </app-frame-table2> -->

      </ng-container>

      <ng-template #newEntryTable>
      <app-frame-newtable-fast [frame]="frame" [wsdp]="wsdp" [wscp_send_input]="wscp" [object_mast]="object_mast"
        [page_no]="page_no" [sessionObj]="sessionObj" [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)"
        (personalize)="personalizeclick($event)">
      </app-frame-newtable-fast>
      </ng-template>



      <!-- <app-frame-new-table [frame]="frame" [wsdp]="wsdp" [wsdpcl]="wsdpcl" [sessionObj]="sessionObj" [object_mast]="object_mast" [page_no]="page_no"
      [wscp_send_input]="wscp" (emitPass)="itemClicked($event)" (personalize)="personalizeclick($event)">
    </app-frame-new-table> -->
    </ng-container>

    <!-- <ng-container *ngSwitchCase="'ENTRY_TABLE_NEW'">
   
      <app-frame-newtable-fast [frame]="frame" [wsdp]="wsdp" [wscp_send_input]="wscp" [object_mast]="object_mast"
        [page_no]="page_no" [sessionObj]="sessionObj" [wsdpcl]="wsdpcl" (emitPass)="itemClicked($event)"
        (personalize)="personalizeclick($event)">
      </app-frame-newtable-fast>

    </ng-container> -->
