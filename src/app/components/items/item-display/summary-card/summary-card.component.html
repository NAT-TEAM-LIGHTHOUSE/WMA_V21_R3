<ion-item class="summary-item-blue" lines="none" (click)="itemClick($event)" *ngIf="num==1" >
  <ion-label>{{summ_card_input.prompt_name}}</ion-label>
 <ion-note slot="end" >{{summ_card_input.value}}</ion-note>
</ion-item>

<ion-item class="summary-item-yellow" lines="none" (click)="itemClick($event)" *ngIf="num==2" >
  <ion-label>{{summ_card_input.prompt_name}}</ion-label>
 <ion-note slot="end" >{{summ_card_input.value}}</ion-note>
</ion-item>


<ion-item class="summary-item-green" lines="none" (click)="itemClick($event)"  *ngIf="num==3">
  <ion-label>{{summ_card_input.prompt_name}}</ion-label>
 <ion-note slot="end" >{{summ_card_input.value}}</ion-note>
</ion-item>

<ion-item class="summary-item-purple" lines="none" (click)="itemClick($event)" *ngIf="num==4" >
  <ion-label>{{summ_card_input.prompt_name}}</ion-label>
 <ion-note slot="end" >{{summ_card_input.value}}</ion-note>
</ion-item>
