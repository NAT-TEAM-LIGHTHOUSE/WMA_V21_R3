<div class="alert-div-danger">
  <div class="head">
<ion-row>
  <ion-col size="12" class="text-right">
    <ion-button class="close-btn" shape="round" size="small" (click)="closeAlert()">
      <ion-icon name="close-circle-outline"></ion-icon>
    </ion-button>
  </ion-col>
</ion-row>
</div>
<div class="body">
<ion-row>
<ion-col size="12">
  <ul>
    <li *ngFor="let p of alertMessage">{{p.para_value}} <span style="text-decoration: underline;" (click) ="goItem(p)"> {{p.item_name}}</span></li>
    
  </ul>
</ion-col>
</ion-row>
</div>
</div>
