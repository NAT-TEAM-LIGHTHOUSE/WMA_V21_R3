<div class="checkbox-container" *ngIf="checkBox.item_sub_type !='CB_N'  && frame_type !='TABLE' && frame_type != 'ENTRY_TABLE' && frame_type != 'FRAME_COLLAPSE' && checkBox.item_sub_type != 'BROWSER'">
  <ion-item class="ion-input-item">
    <ion-label class="propmt-name"> {{checkBox.prompt_name}}</ion-label>
    <ion-checkbox color="primary" [(ngModel)]="checkBox.isChecked"  [ngStyle]="checkBox.display_setting_str"
    [disabled]="checkBox.item_enable_flag && checkBox.item_enable_flag=='F'" #checkName="ngModel"
    [required]="checkBox.data_required_flag=='T'  
|| (checkBox.prompt_name && checkBox.prompt_name[checkBox.prompt_name.length -1] =='*')"
(click)="checkBox.touched=true;itemClick($event)">{{checkBox.prompt_name}}</ion-checkbox>
  </ion-item>
</div>

 <div  class="checkbox-container checkbox" *ngIf="frame_type =='TABLE' || frame_type == 'HORIZONTAL_TABLE' || frame_type == 'ENTRY_TABLE' || frame_type == 'FRAME_COLLAPSE'">
  <ion-item class="ion-input-item">
    <ion-checkbox color="primary" [(ngModel)]="checkBox.isChecked"  [ngStyle]="checkBox.display_setting_str"
    [disabled]="checkBox.item_enable_flag && checkBox.item_enable_flag=='F'" #checkName="ngModel"
    [required]="checkBox.data_required_flag=='T' 
|| (checkBox.prompt_name && checkBox.prompt_name[checkBox.prompt_name.length -1] =='*')"
(click)="checkBox.touched=true;itemClick($event)" >{{checkBox.prompt_name}}</ion-checkbox>
  </ion-item>
</div> 

<div class="new-input-item-type" *ngIf = "checkBox.item_sub_type == 'BROWSER'">
  <ion-row >
    <ion-col size="3" class="text-left">
    <ion-label class="propmt-name"> {{checkBox.prompt_name}}</ion-label>
    </ion-col>
    <ion-col size="9">
    <ion-checkbox color="primary" [(ngModel)]="checkBox.isChecked"  [ngStyle]="checkBox.display_setting_str"
    [disabled]="checkBox.item_enable_flag && checkBox.item_enable_flag=='F'" #checkName="ngModel"
    [required]="checkBox.data_required_flag=='T'  
|| (checkBox.prompt_name && checkBox.prompt_name[checkBox.prompt_name.length -1] =='*')"
(click)="checkBox.touched=true;itemClick($event)"  style="margin-left: 13px;padding-top: 1px;">{{checkBox.prompt_name}}</ion-checkbox>
</ion-col>
  </ion-row>
</div>
