<ng-container *ngIf="frame.apps_frame_sub_type == 'BASIC' || frame.apps_frame_sub_type == 'COLLAPSE'" >
  <ion-footer color="primary">
    <!-- <div class="footer-area"> -->
    <ion-grid>
      <ion-row>
          <ng-container *ngFor="let item of footerArr ; let i = index">
            <ng-container *ngIf="item.item_visible_flag == 'T'">
            <ion-col [size]="footerArr.length > 3 ? 3 : footerArr.length == 3 ? 4 : footerArr.length == 2 ? 6 : footerArr.length < 2 ? 12 : 12"
               *ngIf="i <= 2" (click)="itemClicked(item, frame.Level4, 0)">
              <ion-button expand="full">
                <div class="thumbnail-container">
                  <ion-thumbnail slot="start">
                    <img [src]="item.baseImg" (error)="onImgError($event)">
                  </ion-thumbnail>
                    <ion-label>{{item.prompt_name}}</ion-label>
                </div>
                <div>
                </div>
              </ion-button>
            </ion-col>
          </ng-container>
          </ng-container>
          <ion-col size="3" (click)="openFooter($event)" *ngIf="footerArr.length > 3">
            <ion-button expand="full">
              <ion-label>
                <ion-icon name="ellipsis-vertical"></ion-icon>
              </ion-label>
            </ion-button>
          </ion-col>
      </ion-row>
    </ion-grid>
  </ion-footer>
  </ng-container>
