            (click)="showDeveloperData()">
          </ion-icon></span>
      </h2>
      <ng-container *ngIf="!frame.collapse">
        <ion-button (click)="onEmitChange()" class="db_edit" *ngIf="globalObjects.toggleDevloperMode()">

      </ng-container>
    </div>
  </div>

            *ngIf="!p.showTable" >
          </ion-icon>

          <ion-icon name="remove"  (click)="showItemTab(p)" role="img" class="icon icon-md ion-md-remove" aria-label="remove"

      </thead>
