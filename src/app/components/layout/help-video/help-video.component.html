<div class="ai-assistent-body video"  >
  <div class="doc_search">
    <ion-icon name="search-outline"></ion-icon>
    <ion-input type="text" placeholder="Search documents, videos, FAQs..." ></ion-input>
  </div>

  <div class="ai-assistent-browse" >
    <ion-row >
     <ion-col size="3">
<ion-row class="p-2" style="padding-left: 10px;max-height: calc(100vh - 270px);overflow-x: hidden;overflow-y: auto;">
      <ion-col size="12" *ngFor="let frame of frame.Level4">
        <div class="ai-assistent-browse-item" *ngFor="let item of frame.Level5" (click)="openVideo(item)">
          <div class="video_sect">
            <ion-icon name="play-circle-outline"></ion-icon>
          </div>
          <div>
             <h3>{{ item.prompt_name }}</h3>
            <p>Browse PDF guides & manuals</p>
          </div>
        </div>
      </ion-col>
      <ion-col size="12">
        <div class="ai-assistent-browse-item"> <div class="video_sect">
            <ion-icon name="play-circle-outline"></ion-icon>
          </div> 
          <div>
            <h3>Documents</h3>
            <p>Browse PDF guides & manuals</p>
          </div>
        </div>
      </ion-col>
    </ion-row>
    </ion-col>
     <ion-col size="9">
<div class="view_video" *ngIf="showVideoModal">
<!---->  
<div class="view_video_header d-flex justify-content-between align-items-center">
  <div class="left_view_video d-flex align-items-center justify-content-start">
    <ion-icon name="close-outline" class="p-2 ms-2" (click)="closeVideo()"></ion-icon> <p class="p-2 ms-2">Video Overview</p>
  </div>
  <div class="right_view_video d-flex align-items-center justify-content-end">

  </div>
</div>
<div class="video_body">
  <div class="video_iframe">
    <iframe width="100%" height="60vh" [src]="selectedVideoUrl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </div>
</div>

</div>

     </ion-col>
    </ion-row>
  </div>



</div>
