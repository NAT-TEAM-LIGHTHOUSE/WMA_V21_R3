<div class="reset_password">
  <div class="header_div d-flex align-items-center justify-content-between">
    <ion-icon name="lock-closed-outline" class="lock_key"></ion-icon> <ion-icon name="close-outline" class="close_n" (click)="close()"></ion-icon>
  </div>
  <div class="rest_container">
    <h3>Set Password</h3>
    <p>{{newMess}}</p>
   <div class="input_div" *ngIf="passFlag != 'T'">
     <ion-label>Previous Password</ion-label>
   <div class="input_container">
  <ion-input  [type]="passwordVisibility.prev ? 'text' : 'password'" [(ngModel)]="oldpassword" name="old_password"></ion-input>
  <!-- {{oldpassword}} -->
    <div class="action_btn">
      <ion-button class="btn_password" (click)="toggleVisibility('prev')">
        <ion-icon [name]="(passwordVisibility && passwordVisibility.prev) ?  'eye' : 'eye-off'"></ion-icon>
      </ion-button>
    </div>
   </div>
  </div>
   <div class="input_div">
     <ion-label>New Password</ion-label>
   <div class="input_container">
    <ion-input [type]="passwordVisibility.new ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword"></ion-input>
    <div class="action_btn">
      <ion-button class="btn_password" (click)="toggleVisibility('new')">
        <ion-icon [name]="(passwordVisibility && passwordVisibility.new) ? 'eye' : 'eye-off'"></ion-icon>
      </ion-button>
    </div>
   </div>
  </div>
  <div class="input_div">
     <ion-label>Confirm Password</ion-label>
   <div class="input_container">
    <ion-input [type]="passwordVisibility.confirm ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword"></ion-input>
    <div class="action_btn">
      <ion-button class="btn_password" (click)="toggleVisibility('confirm')">
        <ion-icon [name]="(passwordVisibility && passwordVisibility.confirm) ? 'eye' : 'eye-off'"></ion-icon>
      </ion-button>
    </div>
   </div>
   <div *ngIf="passwordValidationErrors.oldPassword || passwordValidationErrors.newPassword.length > 0 || passwordValidationErrors.confirmPassword.length > 0" class="text-danger">
     <div *ngIf="passwordValidationErrors.oldPassword">❌ {{ passwordValidationErrors.oldPassword }}</div>
     <div *ngFor="let error of passwordValidationErrors.newPassword">❌ {{ error }}</div>
     <div *ngFor="let error of passwordValidationErrors.confirmPassword">❌ {{ error }}</div>
   </div>
  </div>
   <div class="footer_btn d-flex justify-content-end">
    <ion-button class="outline_btn" (click)="close()">Cancel</ion-button>
    <ion-button [disabled]="passwordsDoNotMatch" class="fill_btn" (click)="checkPasswords()">Create new password</ion-button>
   </div> 
     
  </div>
  
</div>
