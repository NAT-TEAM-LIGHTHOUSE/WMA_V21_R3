<div class="quickaction_section" >
  <ul>
    <ng-container *ngFor="let itemGroup of frame.tableRows[0];let i=index">
      <ng-container *ngFor="let item of itemGroup.Level5">
        <ng-container *ngIf="item.item_visible_flag=='T'">
          <li [class]="i == 0 ? 'first' : 'other' + i " (click)="itemClicked(item)"><a>{{item.prompt_name}}</a></li>
        </ng-container>
      </ng-container>
    </ng-container>
  </ul>
</div>
