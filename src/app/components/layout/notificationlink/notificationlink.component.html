<div class="notification-area">
  <div class="list-heading">
    <h6>Mark all as read</h6>
    <div class="row">
      <div class="col-md-12">
        <ion-button>All</ion-button>
        <ion-button>Read</ion-button>
        <ion-button>Unread</ion-button>
      </div>
    </div>
  </div>

  <div class="notes-container">
    <ng-container *ngFor="let data of frame.tableData;let rowindex =index">
      <div class="notification-list">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-md-6">
                <h5 class="card-title">{{data.SYS_TITLE}} </h5>
              </div>
              <div class="col-md-6 text-end">
                <span>{{data.SYS_DATE}}</span>
              </div>
            </div>
            <p class="card-text">{{data.SYS_DESC}}</p>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
