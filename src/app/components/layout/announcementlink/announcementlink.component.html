
<h1 class="canavs_title">Updates</h1>




<div class="announce-tab">
   <div class="tabs">
    <ul>
     <li 
    (click)="Onupdates('Global')" 
    [class.active]="selectedTab === 'Global'">
   <ion-icon name="globe-outline"></ion-icon> Global Updates
  </li>

  <li 
    (click)="Onupdates('Local')" 
    [class.active]="selectedTab === 'Local'">
   <ion-icon name="location-outline"></ion-icon> Release Notes (Development)
  </li>
    </ul>
   </div>  
   <div class="announce-container" *ngIf="selectedTab === 'Global'">

  <div class="d-flex align-items-center justify-content-end">

    <span style="font-size: 14px;">
      Search Year : &nbsp;
    </span>

    <select class="announce-select">

      <option value="all">All</option>

      <option
        *ngFor="let item of globalList"
        [value]="item.lastupdate">

        {{ item.lastupdate | date:'yyyy' }}

      </option>

    </select>

  </div>

  <div
    class="announce-meeting"
    *ngFor="let item of globalList">

    <div class="announce-header">

      <div class="announce-header-btn">

        <div class="announce-datetime">

          {{ item.lastupdate }}

        </div>

      </div>

    </div>

    <div class="announce-body">

      <h3>

        {{ item.release_name }}

        <div class="announce-btn meeting">

          {{ item.build_version }}

        </div>

      </h3>

      <p class="content">

        {{ item.release_desc }}

      </p>

      <input
        type="checkbox"
        [id]="'toggleGlobal' + item.release_id">

      <label
        [for]="'toggleGlobal' + item.release_id"
        class="see-more">

      </label>

    </div>

  </div>

</div>
