<ng-container *ngIf="isClosePopup;else noClosePopup">
 
    <div class="text-center d-flex justify-content-center align-items-center" >
   <ion-icon name="help-outline"></ion-icon>
    </div>

  <p>Are you sure 
you want close all tabs</p>
  <ion-row>
    <ion-col class="text-center">
      <ion-button (click)="ClosePopup('Y')" class="me-2">Yes</ion-button>
  <ion-button (click)="ClosePopup('N')">No</ion-button>
</ion-col>
  </ion-row>
</ng-container>
<ng-template #noClosePopup>
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>{{heading}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="popover-page">
    <ion-textarea type="text" class="input-text"   class="popover-textarea" shape="round"    [(ngModel)]="comment.val" ></ion-textarea>
    <div class="text-center">
    <ion-button shape="round" class="ok-btn"   size="small" (click)="save()">
      Ok
    </ion-button>

    <ion-button color="secondary" shape="round"   size="small" (click)="cancelModal()">
      Close
    </ion-button>
    </div>
  </ion-content>
</ng-template>
