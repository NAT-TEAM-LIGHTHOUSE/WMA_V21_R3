<ion-content class="alert-boxes">

  <ng-container>

    <div class="alert-div">
      <div class="head">
        <ion-row>
          <ion-col size="12" class="text-right">

            <ion-button class="mini-btn" color="primary" shape="round" size="small" (click)="minimise()">
              <ion-icon name="remove"></ion-icon>
            </ion-button>

            <ion-button class="close-btn" color="secondary" shape="round" size="small" (click)="closeAlert()">
              <ion-icon name="close"></ion-icon>
            </ion-button>

          </ion-col>
        </ion-row>
      </div> 
      <div class="body">
        <ion-row>
          <ion-col size="12">
            <div class="info_warning_message" *ngIf="warning.length > 0">
               <div class="info_warning_message_icon">
                <ion-icon name="warning-outline"></ion-icon>
                <h2>Warning</h2>
              </div> 
              </div>
              <div class="danger_warning_message" *ngIf="newWarning.length > 0">
                <div class="danger_warning_message_icon">
                  <ion-icon name="warning-outline"></ion-icon>
                  <h2>Warning</h2>
                </div> 
                </div>
            <div class="multi_msg_area">
            <div class="success" *ngIf="miMessage.length > 0">
              <p *ngFor="let p of miMessage">
                <span style="text-decoration: underline;" (click)="executeAlert(p)"> <ion-icon name="checkmark-circle-outline"></ion-icon> {{p.item_name}}</span> &nbsp;<span>{{p.para_value}}</span>
               
              </p>
            </div>


            <div class="danger" *ngIf="danger.length > 0">
              <p *ngFor="let p of danger">
                <span style="text-decoration: underline;" (click)="executeAlert(p)"> <ion-icon name="close-circle-outline"></ion-icon> {{p.item_name}}</span> &nbsp;<span>{{p.para_value}}</span> 
              </p>
            </div>


            <!-- <div class="warning" *ngIf="warning.length > 0">
              <p *ngFor="let p of warning">
                <span style="text-decoration: underline;" (click)="executeAlert(p)"> <ion-icon name="information-circle-outline"></ion-icon> {{p.item_name}}</span> &nbsp;<span>{{p.para_value}}</span>
              </p>
            </div> -->


            <div class="info_warning_message" *ngIf="warning.length > 0"> 
              <div class="info_warning_message_container">
                 <div class="info_warning_message_section"  *ngFor="let p of warning">
                    <p> {{p.para_value}} </p>
                    <div class="info_warning_message_btn">
                      <ion-button class="yes"  (click)="setFlag(p,'Y')" [class.active]="p.active === 'Y'"  > Yes </ion-button>
                      <ion-button class="no ml-1" (click)="setFlag(p,'N')" [class.active]="p.active"  [class.active]="p.active === 'N'" > No </ion-button>
                    </div>
                 </div>
                 <!-- [class.active]="tab.instance.active" -->
              </div>
             </div>

             <div class="danger_warning_message" *ngIf="newWarning.length > 0">
              <div class="danger_warning_message_container" >
                 <div class="danger_warning_message_section" *ngFor="let p of newWarning">
                    <p>{{p.para_value}} </p>
                    <div class="danger_warning_message_btn">
                      <ion-button class="yes" (click)="setFlag(p,'N')" [class.active]="p.active === 'N'" > Yes </ion-button>
                      <ion-button class="no ml-1" (click)="setFlag(p,'Y')" [class.active]="p.active === 'Y'" > No </ion-button>
                    </div>
                 </div>
               
              
              </div>
             </div>
            

            
          </div>
          </ion-col>
        </ion-row>
        <div class="alert-button-area">
          <div style="width: 100%; text-align: center;">
            <ion-icon class="code-btn" name="information-circle-outline" color="" slot="end" color="primary"
              (click)="showDeveloperData()"></ion-icon>
          </div>
          <ion-button  size="small" shape="round" (click)="closeAlert()">OK</ion-button>
       </div>
      </div>
    </div>

  </ng-container>
</ion-content>
