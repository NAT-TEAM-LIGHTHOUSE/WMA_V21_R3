<ion-header>
  <ion-toolbar>
    <ion-title>Bluetooth</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list padding>
    <ion-list-header>
      <ion-button>
        Scan Devices
      </ion-button>
    </ion-list-header>
    <ion-item *ngFor="let device of pairedDevices">
      <span (click)="selectDevices(device.id)">
        {{device.name || device.address}}
      </span>
    </ion-item>

    <ion-list-header>
      <ion-button>
        availlable Devices
      </ion-button>
    </ion-list-header>
    <ion-item *ngFor='let device of unpairedDevices'>
        <span (click)="selectDevices(device.id)">
            {{device.name || device.address}}
        </span>
    </ion-item>
  </ion-list>
</ion-content>
